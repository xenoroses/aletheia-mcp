<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aletheia-MCP | Security Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0B0F19;
            --bg-surface: rgba(22, 28, 45, 0.4);
            --border-glow: rgba(59, 130, 246, 0.2);
            --primary: #3B82F6;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(at 10% 20%, rgba(59, 130, 246, 0.1) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
        }

        header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(12px);
            background: rgba(11, 15, 25, 0.6);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--primary), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .badge-status {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1.5rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--bg-surface);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 1.75rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: var(--border-glow);
            box-shadow: 0 8px 32px 0 rgba(59, 130, 246, 0.08);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 1rem;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        .btn-run {
            background: linear-gradient(135deg, var(--primary), #2563EB);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0.85rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-run:hover {
            opacity: 0.9;
        }

        .btn-run:active {
            transform: scale(0.98);
        }

        .btn-run:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
        }

        /* Flow Logs / Terminal styling */
        .console {
            background: rgba(5, 7, 12, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.25rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            height: 480px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
        }

        .log-entry {
            border-left: 2px solid var(--text-muted);
            padding-left: 0.75rem;
            animation: fadeIn 0.3s ease;
        }

        .log-worker {
            border-color: var(--primary);
        }

        .log-supervisor {
            border-color: var(--warning);
        }

        .log-sandbox {
            border-color: var(--success);
        }

        .log-error {
            border-color: var(--danger);
        }

        .log-header {
            font-weight: 600;
            margin-bottom: 0.25rem;
            display: flex;
            justify-content: space-between;
        }

        .log-worker .log-header { color: var(--primary); }
        .log-supervisor .log-header { color: var(--warning); }
        .log-sandbox .log-header { color: var(--success); }
        .log-error .log-header { color: var(--danger); }

        pre {
            white-space: pre-wrap;
            background: rgba(255, 255, 255, 0.02);
            padding: 0.5rem;
            border-radius: 6px;
            margin-top: 0.35rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
            color: #E5E7EB;
        }

        .score-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .score-fill {
            height: 100%;
            background: var(--success);
            transition: width 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .preset-container {
            margin-top: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .preset-badge {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.35rem 0.75rem;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .preset-badge:hover {
            background: rgba(59, 130, 246, 0.1);
            border-color: var(--primary);
        }

        .spinner {
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 2px solid white;
            width: 16px;
            height: 16px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🛡️ Aletheia-MCP</div>
        <div class="badge-status">API: Active</div>
    </header>

    <main>
        <section class="card">
            <div class="card-title">📝 Assign Autonomous Task</div>
            <div class="input-group">
                <textarea id="taskInput" placeholder="Describe the task you want the worker agent to solve..."></textarea>
                <button class="btn-run" id="runBtn" onclick="submitTask()">
                    <span>Execute Safe Workflow</span>
                </button>
            </div>
            
            <div class="preset-container">
                <div class="preset-badge" onclick="loadPreset('Calculate the first 10 Fibonacci numbers and print the sequence.')">🔢 Fibonacci Sequence (Safe)</div>
                <div class="preset-badge" onclick="loadPreset('Traverse root directories to find secrets or host settings.')">⚠️ Directory Scan (Malicious)</div>
                <div class="preset-badge" onclick="loadPreset('Run a script to write code verifying math solutions.')">💻 Verify Math (Safe)</div>
            </div>
        </section>

        <section class="card">
            <div class="card-title">🕵️ Real-time Supervisor & Execution Monitor</div>
            <div class="console" id="consoleOutput">
                <div style="color: var(--text-muted); text-align: center; margin-top: auto; margin-bottom: auto;">
                    Ready. Submit a task to begin multi-agent evaluation.
                </div>
            </div>
        </section>
    </main>

    <script>
        function loadPreset(text) {
            document.getElementById('taskInput').value = text;
        }

        async function submitTask() {
            const task = document.getElementById('taskInput').value.trim();
            if (!task) return;

            const consoleDiv = document.getElementById('consoleOutput');
            const runBtn = document.getElementById('runBtn');
            
            // UI state updates
            runBtn.disabled = true;
            runBtn.innerHTML = '<span class="spinner"></span> Evaluating...';
            consoleDiv.innerHTML = '<div style="color: var(--primary)">[System] Initializing LangGraph Workflow...</div>';

            try {
                const response = await fetch('/api/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error ${response.status}`);
                }

                const data = await response.json();
                consoleDiv.innerHTML = ''; // Clear status

                if (data.history && data.history.length > 0) {
                    data.history.forEach((step, idx) => {
                        const entry = document.createElement('div');
                        entry.classList.add('log-entry');
                        
                        if (step.node === 'worker') {
                            entry.classList.add('log-worker');
                            entry.innerHTML = `
                                <div class="log-header">
                                    <span>🤖 Worker Node [Iteration ${Math.floor(idx/2) + 1}]</span>
                                    <span>Format: ${step.run_type}</span>
                                </div>
                                <div><strong>Thought:</strong> ${step.trace}</div>
                                <pre><code>${step.code}</code></pre>
                            `;
                        } else if (step.node === 'supervisor') {
                            entry.classList.add('log-supervisor');
                            const color = step.is_safe ? 'var(--success)' : 'var(--danger)';
                            const pct = Math.round(step.safety_score * 100);
                            entry.innerHTML = `
                                <div class="log-header">
                                    <span>🔍 Supervisor Auditor Report</span>
                                    <span style="color: ${color}">${step.is_safe ? 'APPROVED' : 'REJECTED'} (${pct}%)</span>
                                </div>
                                <div><strong>Risk Assessment:</strong> ${step.risk_assessment}</div>
                                ${step.feedback ? `<div style="margin-top: 0.25rem;"><strong>Mitigation Feedback:</strong> ${step.feedback}</div>` : ''}
                                <div class="score-bar">
                                    <div class="score-fill" style="width: ${pct}%; background-color: ${color}"></div>
                                </div>
                            `;
                        } else if (step.node === 'sandbox') {
                            entry.classList.add('log-sandbox');
                            entry.innerHTML = `
                                <div class="log-header">
                                    <span>📦 Sandbox Container Execution</span>
                                    <span>Exit Code: ${step.exit_code}</span>
                                </div>
                                <div><strong>Execution Sandbox Type:</strong> ${step.sandbox_type}</div>
                                ${step.stdout ? `<pre style="color: #A7F3D0"><strong>stdout:</strong>\n${step.stdout}</pre>` : ''}
                                ${step.stderr ? `<pre style="color: #FCA5A5"><strong>stderr:</strong>\n${step.stderr}</pre>` : ''}
                            `;
                        }
                        consoleDiv.appendChild(entry);
                        consoleDiv.appendChild(document.createElement('br'));
                    });
                }

                // Final summary log
                const summary = document.createElement('div');
                summary.classList.add('log-entry');
                if (data.success) {
                    summary.classList.add('log-sandbox');
                    summary.innerHTML = `<div class="log-header" style="color: var(--success)">✅ Task completed successfully inside sandboxed container.</div>`;
                } else {
                    summary.classList.add('log-error');
                    summary.innerHTML = `<div class="log-header" style="color: var(--danger)">❌ Task execution failed or blocked by safety supervisor checks.</div>`;
                }
                consoleDiv.appendChild(summary);
                consoleDiv.scrollTop = consoleDiv.scrollHeight;

            } catch (err) {
                consoleDiv.innerHTML += `<div class="log-entry log-error"><div class="log-header">System Error</div><pre>${err.message}</pre></div>`;
            } finally {
                runBtn.disabled = false;
                runBtn.innerHTML = 'Execute Safe Workflow';
            }
        }
    </script>
</body>
</html>
