[project]
name = "aletheia-mcp"
version = "0.1.0"
description = "Aletheia-MCP: Truth-auditing and runtime verification for autonomous LLMs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.0.60",
    "langchain-core>=0.2.0",
    "langchain-google-genai>=1.0.0",
    "langchain-community>=0.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "docker>=7.0.0",
    "pydantic>=2.6.0",
    "chromadb>=0.4.24",
    "jinja2>=3.1.3",
    "python-dotenv>=1.0.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aletheia"]
